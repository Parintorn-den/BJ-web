<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามสถานะเรือ | B.J. Interfreight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{--bg:#e9eff2;--paper:#f6f9fa;--ink:#102a43;--mute:#52667a;--line:#b9cbd6;--route:#1f6f8b;--amber:#d98e04;--amber-bg:#fff3d1;--ok:#1b7a4b;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a;--paper:#13263a;--ink:#e6eef5;--mute:#9db1c3;--line:#2c4560;--route:#5bb5d1;--amber:#f0b429;--amber-bg:#3a2e0f;--ok:#4cc38a;--err:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0d1b2a;--paper:#13263a;--ink:#e6eef5;--mute:#9db1c3;--line:#2c4560;--route:#5bb5d1;--amber:#f0b429;--amber-bg:#3a2e0f;--ok:#4cc38a;--err:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;font-weight:600;font-size:18px}
header small{font-weight:400;color:var(--mute);font-size:14px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:26px 0 6px;font-weight:600}
.lead{color:var(--mute);margin:0 0 20px;max-width:60ch}
form{background:var(--paper);border:1px solid var(--line);padding:18px;display:grid;gap:14px;grid-template-columns:1fr}
@media(max-width:720px){form{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-weight:500;font-size:14px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
.go{background:var(--ink);color:var(--bg);border:0;padding:11px 22px;font-weight:600;border-radius:2px}
.pick{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:2px;font-size:14px}
.err{color:var(--err);font-weight:500;margin:14px 0 0}
.note{color:var(--mute);font-size:13px;margin:8px 0 0}
.status{margin-top:26px;padding:14px 18px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--route)}
.status.done{border-left-color:var(--ok)}.status.wait{border-left-color:var(--amber)}
.status h2{margin:0;font-size:21px}.status p{margin:2px 0 0;color:var(--mute);font-size:14px}
.meta{margin:12px 0;color:var(--mute);font-size:14px}.meta b{color:var(--ink);font-weight:500}
.tl{margin:18px 0 0 10px;border-left:3px solid var(--line)}
.node{position:relative;padding:2px 0 2px 24px;font-weight:600}
.node::before{content:"";position:absolute;left:-11px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--route)}
.node.on::before{background:var(--route)}
.seg{margin:6px 0 6px 24px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--line);font-size:14px}
.seg.done{border-left-color:var(--ok)}.seg.go{border-left-color:var(--amber)}.seg.over{border-left-color:var(--err)}
.seg .v{font-weight:600;font-size:15px}
.badge{display:inline-block;font-size:12px;padding:0 8px;border:1px solid var(--line);border-radius:99px;color:var(--mute);margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:2px 22px;margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:99px;border:1px solid var(--line);margin-left:6px;color:var(--mute)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.seg a{color:var(--route);font-size:13px}
.remark{margin-top:18px;padding:12px 16px;background:var(--amber-bg);border-left:6px solid var(--amber);font-size:14px}
.seg{margin:8px 0;display:flex;align-items:center;gap:12px}.seg .body{flex:1;min-width:0}.seg p{font-size:14px}.seg a{color:var(--route)}
.seg.wait{border-left-color:var(--amber)}.seg.sail{border-left-color:var(--route)}.seg.arrived{border-left-color:var(--ok)}
.ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.ico svg{width:20px;height:20px;display:block}
.ico.wait{color:var(--amber)}.ico.sail{background:var(--route);color:#fff}.ico.arrived{background:var(--ok);color:#fff}
.tagline{display:inline-block;font-size:12px;font-weight:600;margin-left:8px;padding:0 8px;border-radius:99px;border:1px solid currentColor;vertical-align:2px}
.tagline.wait{color:var(--amber)}.tagline.sail{color:var(--route)}.tagline.arrived{color:var(--ok)}
.spin{animation:spin 1.1s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.meta{margin:26px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header><span>B.J. Interfreight</span><small>Vessel Status</small></header>
<h1>เรือของคุณอยู่ตรงไหนแล้ว</h1>
<p class="lead">กรอกเลข Booking ให้ตรงกับเอกสารการจอง เพื่อดูเส้นทางและกำหนดการเรือที่บรรทุกตู้สินค้าของคุณ</p>
<form id="f" novalidate>
<label>เลข Booking<input id="bk" autocomplete="off" required></label>
<div class="actions"><button class="go" id="go" type="submit">ตรวจสอบสถานะ</button></div>
</form>
<div id="msg"></div>
<div id="result" aria-live="polite"></div>
</div>
<script>
var API="https://script.google.com/macros/s/AKfycbwPGoSyjIDdkr2b4Vs5zONZvYG3L6QbmQxdYeQq7hjZV2HBEpcQeJLpUkNDZK14v-S8mQ/exec"; /* วางลิงก์ Web app ของ Apps Script (ลงท้ายด้วย /exec) */
var TH=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var MON="jan feb mar apr may jun jul aug sep oct nov dec".split(" ");
var $=function(i){return document.getElementById(i)};
var norm=function(s){return String(s).toLowerCase().replace(/[\s\-_.,()\/]/g,"")};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var NAV={1:"ทอดสมอ",5:"จอดเทียบท่า",2:"เรือไม่อยู่ในการควบคุม",3:"เคลื่อนที่จำกัด",6:"เกยตื้น"};
function ago(ts){var m=Math.max(0,Math.round((Date.now()-ts*1000)/60000));
 return m<1?"เมื่อสักครู่":m<60?m+" นาทีที่แล้ว":m<1440?Math.round(m/60)+" ชั่วโมงที่แล้ว":Math.round(m/1440)+" วันที่แล้ว"}
function etaTxt(e){if(!e||!e.Month||!e.Day)return"";var p=function(n){return String(n).padStart(2,"0")};
 return e.Day+" "+TH[e.Month-1]+(e.Hour<24?" "+p(e.Hour)+":"+p(e.Minute||0)+" UTC":"")}
var IC={wait:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path class="spin" d="M12 3a9 9 0 1 0 9 9"/></svg>',
 arrived:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 sail:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3h2v3h4l-1 5H8L7 6h4V3z"/><path d="M3.5 13h17l-2.6 5.4a2 2 0 0 1-1.8 1.1H7.9a2 2 0 0 1-1.8-1.1L3.5 13z"/></svg>'};
var LBL={wait:"ไม่พบสัญญาณ",sail:"กำลังแล่น",arrived:"จอดถึงท่าแล้ว"};
function kind(s){if(!s.found)return"wait";
 if(s.nav===5||(s.sog!=null&&s.sog<1&&s.nav!==1&&s.nav!==0))return"arrived";
 return"sail"}
function card(l){var s=l.st||{},k=kind(s),ico='<span class="ico '+k+'">'+IC[k]+'</span>',b='<div class="body"><span class="v">'+esc(l.v)+'</span><span class="tagline '+k+'">'+LBL[k]+'</span>';
 if(!s.found){b+='<p style="margin:6px 0 0;color:var(--mute)">'+(s.error?"ตอนนี้ดึงข้อมูลตำแหน่งไม่ได้ กรุณาลองใหม่ภายหลัง":"ยังไม่พบสัญญาณ AIS ของเรือลำนี้ (เรืออาจอยู่นอกพื้นที่รับสัญญาณ หรือเพิ่งเริ่มติดตาม)")+'</p>'}
 else{var mv=s.nav in NAV?NAV[s.nav]:(s.sog!=null&&s.sog>=1?"กำลังแล่น":"แทบหยุดนิ่ง");
  b+='<div class="row"><span>สถานะ: <b>'+mv+'</b>'+(s.sog!=null?" · "+s.sog.toFixed(1)+" นอต":"")+'</span>'+
   '<span>ตำแหน่ง: <a href="https://www.google.com/maps?q='+s.lat+','+s.lon+'" target="_blank" rel="noopener">'+s.lat.toFixed(3)+', '+s.lon.toFixed(3)+'</a></span></div>';
  var d=s.dest?'<span>ปลายทางที่เรือแจ้ง: <b>'+esc(s.dest)+'</b></span>':"",e=etaTxt(s.eta)?'<span>ETA ที่เรือแจ้ง: <b>'+esc(etaTxt(s.eta))+'</b></span>':"";
  if(d||e)b+='<div class="row">'+d+e+'</div>';
  var old=Date.now()/1000-s.ts>86400;
  b+='<div class="row"><span style="color:'+(old?"var(--err)":"var(--mute)")+'">อัปเดตล่าสุด '+ago(s.ts)+(old?" (ข้อมูลเก่า)":"")+'</span></div>'}
 b+='</div>';
 return '<div class="seg '+k+'">'+(k==="arrived"?ico+b:b+ico)+'</div>'}
function render(b){var h='<div class="meta">Booking <b>'+esc(b.bk)+'</b></div>';
 h+='<div class="status" style="margin-top:8px"><h2>เรือของ Booking นี้</h2><p>'+esc(b.legs.map(function(l){return l.v}).join(" → "))+'</p></div>';
 b.legs.forEach(function(l){h+=card(l)});
 h+='<div class="remark"><b>หมายเหตุ:</b> ตำแหน่งมาจากสัญญาณ AIS ที่เรือส่งออกมา ซึ่งอาจล่าช้า ขาดช่วง หรือไม่ถูกต้อง 100% ปลายทางและ ETA เป็นค่าที่ลูกเรือกรอก กรุณายืนยันกับทีม CS ของ B.J. Interfreight ก่อนตัดสินใจเรื่องสำคัญ</div>';
 $("result").innerHTML=h;$("result").scrollIntoView({behavior:"smooth",block:"start"})}
function showErr(m){$("result").innerHTML="";$("msg").innerHTML='<p class="err">'+m+'</p>'}
var cd=null,NF="ไม่พบข้อมูล ตรวจสอบเลข Booking ให้ตรงกับเอกสาร หรือติดต่อทีม CS ของ B.J. Interfreight";
function cooldown(){var n=5,go=$("go");$("result").innerHTML="";go.disabled=true;clearInterval(cd);
 function tick(){$("msg").innerHTML='<p class="err">'+NF+'<br>โปรดลองใหม่อีกครั้งในอีก <b>'+n+'</b> วินาที</p>';go.textContent="ลองใหม่ได้ใน "+n+" วินาที"}
 tick();cd=setInterval(function(){n--;
  if(n<=0){clearInterval(cd);cd=null;go.disabled=false;go.textContent="ตรวจสอบสถานะ";$("msg").innerHTML='<p class="err">'+NF+'</p>'}else tick()},1000)}
$("f").addEventListener("submit",function(e){e.preventDefault();if(cd)return;$("msg").innerHTML="";
 var bk=$("bk").value.trim();
 if(!bk){showErr("กรอกเลข Booking");return}
 if(!API){showErr("ยังไม่ได้ตั้งค่าลิงก์ API ในไฟล์ index.html");return}
 var go=$("go");go.disabled=true;go.textContent="กำลังตรวจสอบ...";
 fetch(API+"?bk="+encodeURIComponent(bk)).then(function(r){return r.json()})
 .then(function(j){
  if(j.ok){render(j.b)}
  else if(j.error==="busy")showErr("มีการค้นหาที่ไม่สำเร็จมากเกินไป กรุณาลองใหม่ในอีกสักครู่");
  else if(j.error)showErr("ระบบขัดข้อง กรุณาลองใหม่ภายหลัง หรือติดต่อทีม CS");
  else cooldown()})
 .catch(function(){showErr("เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่ภายหลัง")})
 .then(function(){if(!cd){go.disabled=false;go.textContent="ตรวจสอบสถานะ"}})});
</script>
</body>
</html>
